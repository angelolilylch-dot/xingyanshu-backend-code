app:
  name: xingyanshu-backend
  environment: test
  # 后端接口联调基准：http://101.43.49.193:8090（远端服务，不是本机监听地址）。
  server:
    address: ":8080"
  worker:
    poll_interval: 5s

logging:
  directory: logs/test
  retention_days: 30
  also_stdout: true

database:
  driver: mysql
  # 本地真实核身调试库；账号和密码只从本机环境变量读取，禁止写入仓库。
  host: localhost
  port: 3306
  name: xingyanshu_test
  username: ${XINGYANSHU_DB_USERNAME}
  password: ${XINGYANSHU_DB_PASSWORD}

redis:
  address: 127.0.0.1:6379
  password: ""
  database: 0

auth:
  jwt_secret: xingyanshu_test_only_change_before_production
  access_token_ttl: 2h
  refresh_token_ttl: 168h

cors:
  allowed_origins:
    - "*"

content_safety:
  # 本地个人形象真实核身调试不依赖内容安全服务；避免未配置 TMS 凭据阻断服务启动。
  provider: mock
  region: ap-guangzhou
  biz_type: ip_center
  secret_id: ${XINGYANSHU_TMS_SECRET_ID}
  secret_key: ${XINGYANSHU_TMS_SECRET_KEY}
  timeout: 10s

evidence:
  provider: mock
  callback_secret: xingyanshu_test_evidence_callback_secret

avatar:
  # 扫码建档 H5 统一展示的固定客服号码；不按城市维护联系人。
  fallback_support_phone: "400-800-1234"
  # 后台创建二维码时返回的可直接扫码打开的独立 H5 地址。
  registration_h5_url: "https://avatar-h5.test.xingyanshu.example/register"
  # 名单导入时直接调用三要素实名服务；mock 仅允许 test 环境。
  roster_identity_provider: mock
  # 改为 tencent_phone_verification 后，手动执行批次核验会调用腾讯云 PhoneVerification。
  roster_identity:
    secret_id: ${XINGYANSHU_ROSTER_IDV_SECRET_ID}
    secret_key: ${XINGYANSHU_ROSTER_IDV_SECRET_KEY}
    region: ap-guangzhou
    verify_mode: "0"
    timeout: 15s
  # 真实照片人脸核身仅由后端在提交后执行；凭据和 RSA 公钥只能从本机环境变量读取。
  face_identity:
    provider: ${XINGYANSHU_FACEID_PROVIDER}
    secret_id: ${XINGYANSHU_FACEID_SECRET_ID}
    secret_key: ${XINGYANSHU_FACEID_SECRET_KEY}
    public_key: ${XINGYANSHU_FACEID_RSA_PUBLIC_KEY}
    timeout: 15s
  sms_resend_interval: 1m
  sms_daily_limit: 10
  upload_credential_parallel: 3
  profile_poll_interval: 2s

file:
  storage:
    # 本地 H5 联调使用后端 Mock 直传，不依赖 COS 跨域配置；仅允许 test 环境。
    provider: mock
    local_root: .runtime/mock-storage
    mock_upload_base_url: http://127.0.0.1:8080
    key_prefix: xingyanshu/test
  signed_url_ttl: 10m
  watch_interval: 2s
  policy:
    images:
      extensions: [jpg, jpeg, png, webp]
      max_size_mb: 10
    documents:
      extensions: [pdf, doc, docx, xls, xlsx]
      max_size_mb: 30
    media:
      extensions: [mp4, mp3, wav]
      max_size_mb: 200

bootstrap:
  platform_org_name: 星衍树平台运营主体
  initial_admin:
    username: platform_admin
    password: Admin@123456
    display_name: 平台管理员
