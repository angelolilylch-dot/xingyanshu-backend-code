app:
  name: xingyanshu-backend
  environment: test
  server:
    address: ":8080"
  worker:
    poll_interval: 5s

logging:
  directory: logs/test
  retention_days: 30
  also_stdout: true

database:
  driver: mysql
  host: 127.0.0.1
  port: 3306
  name: xingyanshu_test
  username: root
  password: root

redis:
  address: 127.0.0.1:6379
  password: ""
  database: 0

auth:
  jwt_secret: xingyanshu_test_only_change_before_production
  access_token_ttl: 2h
  refresh_token_ttl: 168h

cors:
  allowed_origins:
    - "*"

content_safety:
  provider: tencent_tms
  region: ap-guangzhou
  biz_type: ip_center
  secret_id: ${XINGYANSHU_TMS_SECRET_ID}
  secret_key: ${XINGYANSHU_TMS_SECRET_KEY}
  timeout: 10s

evidence:
  # 仅用于测试环境模拟第三方存证回调，生产环境禁止使用 mock。
  provider: mock
  callback_secret: xingyanshu_test_evidence_callback_secret

avatar:
  # 扫码建档 H5 统一展示的固定客服号码；不按城市维护联系人。
  fallback_support_phone: "400-800-1234"
  # 后台创建二维码时返回的可直接扫码打开的独立 H5 地址。
  registration_h5_url: "https://avatar-h5.test.xingyanshu.example/register"
  # 名单导入时直接调用三要素实名服务；mock 仅允许 test 环境。
  roster_identity_provider: mock
  # 改为 tencent_phone_verification 后，手动执行批次核验会调用腾讯云 PhoneVerification。
  roster_identity:
    secret_id: ${XINGYANSHU_ROSTER_IDV_SECRET_ID}
    secret_key: ${XINGYANSHU_ROSTER_IDV_SECRET_KEY}
    region: ap-guangzhou
    verify_mode: "0"
    timeout: 15s
  # 可选：仅个人形象素材改为 Mock，后台通用文件仍使用下方 COS。
  # 服务器 H5 联调时请改为服务器自身可访问的地址。
  asset_storage:
    provider: mock
    local_root: .runtime/avatar-mock-storage
    mock_upload_base_url: http://127.0.0.1:8080
  sms_resend_interval: 1m
  sms_daily_limit: 10
  upload_credential_parallel: 3
  profile_poll_interval: 2s

file:
  storage:
    provider: cos
    key_prefix: xingyanshu/test/autotest
    cos:
      bucket_url: ${XINGYANSHU_COS_BUCKET_URL}
      secret_id: ${XINGYANSHU_COS_SECRET_ID}
      secret_key: ${XINGYANSHU_COS_SECRET_KEY}
  signed_url_ttl: 10m
  watch_interval: 2s
  policy:
    images:
      extensions: [jpg, jpeg, png, webp]
      max_size_mb: 10
    documents:
      extensions: [pdf, doc, docx, xls, xlsx]
      max_size_mb: 30
    media:
      extensions: [mp4, mp3, wav]
      max_size_mb: 200

bootstrap:
  platform_org_name: 星衍树平台运营主体
  initial_admin:
    username: platform_admin
    password: Admin@123456
    display_name: 平台管理员
